name: Build

on:
  push:
    paths-ignore:
      - .github/**
      - .idea/**
      - .gitignore
      - CHANGELOG.md
      - README.md
  pull_request:
    paths-ignore:
      - .github/**
      - .idea/**
      - .gitignore
      - CHANGELOG.md
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Get Java Version
        id: java_version
        run: echo "version=$(grep '^javaVersion=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java_version.outputs.version }}
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Gradle build
        run: ./gradlew build
        shell: bash

      - uses: actions/upload-artifact@v5
        with:
          name: Artifacts
          path: build/libs/

      - name: Get Mod Version
        id: mod_version
        run: echo "version=$(grep '^modVersion=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Create Git Tag
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.mod_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.mod_version.outputs.version }}
          name: v${{ steps.mod_version.outputs.version }}
          generate_release_notes: true
          files: build/libs/*.jar
